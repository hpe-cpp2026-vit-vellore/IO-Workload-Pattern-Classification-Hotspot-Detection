services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    image: hpe-control-plane:latest
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_RETRY_ATTEMPTS: "5"
      REDIS_RETRY_DELAY: "5"
      CORS_ORIGINS: "http://localhost:8501,http://127.0.0.1:8501,http://dashboard:8501"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./configs:/app/configs
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  dashboard:
    build: .
    image: hpe-control-plane:latest
    command: streamlit run dashboard/Home.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    environment:
      HPE_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  stream-worker:
    build: .
    image: hpe-control-plane:latest
    command: python src/pipeline/stream_worker.py
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./configs:/app/configs
      - ./data:/app/data
    restart: unless-stopped

  telemetry-generator:
    build: .
    image: hpe-control-plane:latest
    command: python scripts/telemetry_playback.py
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  redis-data:
