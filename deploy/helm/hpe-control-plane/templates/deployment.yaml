{{/*
deployment.yaml — HPE Control Plane API Deployment
Migrated from deploy/k8s/01-api-deployment.yaml (Deployment section)
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: hpe-api
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: hpe-api
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: hpe-api
        release: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
      containers:
      - name: control-plane-api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        # ── Static config values ──────────────────────────────────────────
        - name: ENVIRONMENT
          value: {{ .Values.environment | quote }}
        - name: BUS_TYPE
          value: {{ .Values.config.busType | quote }}
        - name: DB_TYPE
          value: {{ .Values.config.dbType | quote }}
        - name: INFERENCE_MODE
          value: {{ .Values.config.inferenceMode | quote }}
        # ── Secrets injected from K8s Secret object ───────────────────────
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.config.existingSecret }}
              key: redis-url
        - name: TIMESCALE_DSN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.config.existingSecret }}
              key: timescale-dsn
        - name: API_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.config.existingSecret }}
              key: api-key-secret
        # ── Health Probes (map to /health/live and /health/ready in api/main.py) ──
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
