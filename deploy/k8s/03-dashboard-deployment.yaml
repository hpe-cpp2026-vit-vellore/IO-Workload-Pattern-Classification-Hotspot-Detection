apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpe-control-plane-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpe-dashboard
  template:
    metadata:
      labels:
        app: hpe-dashboard
    spec:
      containers:
      - name: dashboard
        image: hpe-dashboard:prod
        command: ["streamlit", "run", "dashboard/Home.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
        ports:
        - containerPort: 8501
        env:
        - name: HPE_API_URL
          value: "http://hpe-api-service:80"
---
apiVersion: v1
kind: Service
metadata:
  name: hpe-dashboard-service
spec:
  type: LoadBalancer
  selector:
    app: hpe-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
