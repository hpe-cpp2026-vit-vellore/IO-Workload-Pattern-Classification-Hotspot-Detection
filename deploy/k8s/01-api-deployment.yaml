apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpe-control-plane-api
  labels:
    app: hpe-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hpe-api
  template:
    metadata:
      labels:
        app: hpe-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: control-plane-api
        image: hpe-control-plane:prod
        command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: BUS_TYPE
          value: "kafka" # Demonstrating production message bus switch
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: hpe-storage-secrets
              key: redis-url
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: hpe-api-service
spec:
  type: ClusterIP
  selector:
    app: hpe-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
